<!doctype html>
<html lang="es" data-mode="light" data-accent="amber">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AllCo — Tu negocio, bajo control" />
    <meta name="theme-color" content="#101826" />
    <title>AllCo</title>
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      (function () {
        try {
          var mode = localStorage.getItem("allco-theme-mode") || "light";
          var accent = localStorage.getItem("allco-theme-accent") || "neutro";
          var font = localStorage.getItem("allco-theme-font") || "dm-sans";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.mode = dark ? "dark" : "light";
          document.documentElement.dataset.accent = accent;
          document.documentElement.dataset.font = font;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Pinta el fondo antes de que cargue el CSS de la app (evita el flash blanco). */
      html,
      body {
        margin: 0;
        background: #f6f7f9;
      }
      html[data-mode="dark"],
      html[data-mode="dark"] body {
        background: #08090a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
