name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            label: windows
          - os: macos-latest
            bundles: app,dmg
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build AllCo
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: allco-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater manifest
        run: node scripts/latest-json.mjs artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Instaladores de AllCo v0.1.0.

          Windows: `AllCo_0.1.0_x64-setup.exe` (NSIS) o `AllCo_0.1.0_x64_en-US.msi`.

          macOS (Apple Silicon): abre el DMG y arrastra AllCo a Aplicaciones. Si macOS muestra
          "AllCo está dañado", abre Terminal y ejecuta:

              xattr -cr /Applications/AllCo.app

          Eso quita la cuarentena de la descarga. Para que no aparezca nunca el aviso hace falta
          firmar y notarizar la app con un certificado de Apple Developer.
          EOF
          gh release delete "$GITHUB_REF_NAME" --yes || true
          mapfile -t assets < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No se encontraron instaladores para publicar" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AllCo $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${assets[@]}" latest.json
